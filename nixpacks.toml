# Railway Nixpacks configuration for Laravel
[phases.setup]
nixPkgs = ["php83", "php83Extensions.pdo", "php83Extensions.pdo_mysql", "php83Extensions.pdo_sqlite", "php83Extensions.mbstring", "php83Extensions.openssl", "php83Extensions.curl", "php83Extensions.xml", "php83Extensions.tokenizer", "php83Extensions.ctype", "php83Extensions.fileinfo", "php83Extensions.bcmath", "php83Extensions.gd", "php83Extensions.sqlite3", "nodejs_20"]

[phases.install]
cmds = [
    "mkdir -p /opt/storage/framework/{sessions,views,cache}",
    "composer install --no-dev --optimize-autoloader --no-interaction",
    "npm ci --ignore-scripts"
]

[phases.build]
cmds = [
    "npm run build",
    "php artisan config:cache",
    "php artisan route:cache",
    "php artisan view:cache"
]

[start]
cmd = "touch database/database.sqlite && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=${PORT:-8080}"
